name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o AIWorkout.zip
      - run: sed -i '1a import androidx.compose.ui.Modifier' AIWorkout/app/src/main/java/com/example/aiworkout/Health.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: AIWorkout
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AIWorkout/app/build/outputs/apk/debug/app-debug.apk
